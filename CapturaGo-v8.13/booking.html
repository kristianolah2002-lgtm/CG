<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/i18n.js"></script>
  <title>Your booking – CapturaGo</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="page-simple">
<script src="/consent.js"></script>
<nav class="simple-nav">
  <a href="/" class="logo"><svg class="logo-icon" viewBox="-110 -110 220 220" width="0.9em" height="0.9em" aria-hidden="true" style="display:inline;vertical-align:-0.08em"><path d="M 0.00 -100.00 Q 3.18 -25.68 14.14 -14.14 Q 25.68 -3.18 100.00 0.00 Q 25.68 3.18 14.14 14.14 Q 3.18 25.68 0.00 100.00 Q -3.18 25.68 -14.14 14.14 Q -25.68 3.18 -100.00 0.00 Q -25.68 -3.18 -14.14 -14.14 Q -3.18 -25.68 0.00 -100.00 Z" fill="currentColor"/></svg> CapturaGo</a>
  <a href="/" class="back">← Home</a>
</nav>
<main class="center-page">
  <div class="narrow-card booking-result" id="result">
    <h1>One moment…</h1>
    <p class="muted">Checking your booking.</p>
  </div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/vendor/supabase.umd.js"></script>
<script src="/supabase.js"></script>
<script src="/site.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const box = document.getElementById('result');
  const params = new URLSearchParams(location.search);
  const id = params.get('b') || '';
  const outcome = params.get('s');
  const money = (c) => `€${(c / 100).toFixed(2)}`;
  const show = (title, html) => { box.innerHTML = `<h1>${title}</h1>${html}`; };
  const actions = `<div class="result-actions"><a class="primary-btn" href="/dashboard.html#bookings" style="text-decoration:none">View my bookings</a><a class="secondary-btn" href="/" style="text-decoration:none">Back to CapturaGo</a></div>`;

  if (!/^[0-9a-f-]{36}$/i.test(id)) {
    show('Booking not found', `<p class="muted">This link looks incomplete.</p>${actions}`);
    return;
  }
  const user = await CG.auth.getUser();
  if (outcome === 'cancel') {
    // Free the day right away (and any gift card money) instead of waiting for the checkout to time out
    if (user) {
      const { data } = await CG.bookings.get(id);
      if (data && data.status === 'pending_payment' && data.client_user_id === user.id) await CG.bookings.action(id, 'cancel');
    }
    show('Payment cancelled', `<p class="muted">No money was taken. You can book again whenever you're ready.</p>${actions}`);
    return;
  }
  if (!user) {
    show('Please sign in', `<p class="muted">Sign in on the homepage to see your booking.</p>${actions}`);
    return;
  }

  // Split between friends: the organiser has paid their share → show the friends' payment links
  const splitView = async (b) => {
    const { data: shares } = await CG.split.mine(b.id);
    const list = Array.isArray(shares) ? shares : [];
    const mine = list.find((x) => x.share_no === 1);
    if (!mine || mine.status !== 'paid') return false;
    const paid = list.filter((x) => x.status === 'paid').length;
    const links = list.filter((x) => x.status === 'pending' && x.token).map((x) => {
      const url = `${location.origin}/pay.html#t=${x.token}`;
      return `<li class="share-link"><span class="share-no">Friend ${x.share_no - 1} · ${money(x.amount_cents)}</span>
        <span class="share-url" translate="no">${esc(url)}</span>
        <span class="share-btns"><button type="button" class="secondary-btn" data-copy="${esc(url)}">Copy link</button>${navigator.share ? `<button type="button" class="secondary-btn" data-share="${esc(url)}">Share</button>` : ''}</span></li>`;
    }).join('');
    show('Your share is paid 🎉', `
      <p><strong>${esc(b.package_name)}</strong> with ${b.photographers ? esc(b.photographers.name) : 'your creator'}<br/>on <strong>${esc(b.shoot_date)}</strong></p>
      <p class="split-status" id="splitStatus">${esc(splitNote(b, paid))}</p>
      <p class="muted">Send each friend one link. Every link can be paid once, by anyone with a CapturaGo account. When everyone has paid, the booking goes to the creator — if not, everyone is refunded automatically.</p>
      <ul class="share-links">${links}</ul>${actions}`);
    box.querySelectorAll('[data-copy]').forEach((btn) => btn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(btn.dataset.copy); showToast('Link copied — send it to your friend.', 'success'); } catch { showToast('Copy the link by hand: ' + btn.dataset.copy, 'info', 8000); }
    }));
    box.querySelectorAll('[data-share]').forEach((btn) => btn.addEventListener('click', () => {
      navigator.share({ title: 'Your share of our photo shoot', text: `Here's your share of our ${b.package_name} shoot on ${b.shoot_date}:`, url: btn.dataset.share }).catch(() => {});
    }));
    return true;
  };

  // The payment confirmation from Stripe can arrive a few seconds after you land here.
  for (let attempt = 0; attempt < 12; attempt++) {
    const { data } = await CG.bookings.get(id);
    if (data && data.status === 'pending_payment' && Number(data.split_count) > 1 && await splitView(data)) return;
    if (data && data.status !== 'pending_payment') {
      const paidLine = Number(data.split_count) > 1 ? `Everyone has paid their share (${money(data.total_cents)} in total).`
        : Number(data.gift_cents) > 0 ? `You paid ${money(data.total_cents)} (${money(data.gift_cents)} from a gift card).` : `You paid ${money(data.total_cents)}.`;
      const who = data.photographers ? `${esc(data.photographers.name)} (${esc(data.photographers.city)})` : 'your creator';
      if (['paid', 'confirmed'].includes(data.status) && !(Number(data.gift_cents) >= data.total_cents)) {
        // Count each booking as a conversion only once (reloads don't double-count)
        try {
          const k = 'cg_tracked_' + data.id;
          if (!localStorage.getItem(k)) {
            if (window.CGConsent?.track('purchase', { value: data.total_cents / 100, id: data.id })) localStorage.setItem(k, '1');
          }
        } catch {}
      }
      if (['paid', 'confirmed'].includes(data.status) && data.booking_type === 'delivery') {
        show('Order received 🎉', `
          <p><strong>${esc(data.package_name)}</strong> with ${who}<br/>due by <strong>${esc(data.shoot_date)}</strong></p>
          <p class="muted">${paidLine} Your payment is held safely by CapturaGo until you approve the delivery.</p>
          <ol class="next-steps"><li>The creator accepts your order (you'll get an email).</li><li>They deliver a link to the finished files by the due date.</li><li>You approve it — or ask for a revision — and the creator gets paid.</li></ol>
          ${actions}`);
      } else if (['paid', 'confirmed'].includes(data.status)) {
        show('Booking received 🎉', `
          <p><strong>${esc(data.package_name)}</strong> with ${who}<br/>on <strong>${esc(data.shoot_date)}</strong></p>
          <p class="muted">${paidLine} Your payment is held safely by CapturaGo and is only released to the creator after your shoot.</p>
          <ol class="next-steps"><li>The creator confirms your booking (you'll get an email).</li><li>Meet on the day and enjoy your shoot.</li><li>Confirm the shoot happened — the creator gets paid.</li></ol>
          ${actions}`);
      } else {
        show('Booking update', `<p class="muted">Status: <strong>${esc(data.status)}</strong>.</p>${actions}`);
      }
      return;
    }
    await new Promise((r) => setTimeout(r, 2000));
  }
  show('Payment processing', `<p class="muted">Your payment is still being confirmed. This can take a minute — you'll receive an email, and the booking will appear in your dashboard.</p>${actions}`);
});
</script>
</body>
</html>
