<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/i18n.js"></script>
  <title>Unsubscribe – CapturaGo</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="page-simple">
<script src="/consent.js"></script>
<nav class="simple-nav">
  <a href="/" class="logo"><svg class="logo-icon" viewBox="-110 -110 220 220" width="0.9em" height="0.9em" aria-hidden="true" style="display:inline;vertical-align:-0.08em"><path d="M 0.00 -100.00 Q 3.18 -25.68 14.14 -14.14 Q 25.68 -3.18 100.00 0.00 Q 25.68 3.18 14.14 14.14 Q 3.18 25.68 0.00 100.00 Q -3.18 25.68 -14.14 14.14 Q -25.68 3.18 -100.00 0.00 Q -25.68 -3.18 -14.14 -14.14 Q -3.18 -25.68 0.00 -100.00 Z" fill="currentColor"/></svg> CapturaGo</a>
  <a href="/" class="back">Find a photographer →</a>
</nav>
<main class="share-page">
  <div id="unsubBox" class="share-inner" aria-live="polite">
    <div class="narrow-card share-empty"><h1>Unsubscribing…</h1></div>
  </div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/vendor/supabase.umd.js"></script>
<script src="/supabase.js"></script>
<script src="/site.js"></script>
<script>
window.addEventListener('hashchange', () => location.reload());
document.addEventListener('DOMContentLoaded', async () => {
  const box = document.getElementById('unsubBox');
  // The key is in the #fragment, so it never reaches server logs or other websites
  const token = (new URLSearchParams(location.hash.slice(1)).get('t') || '').toLowerCase();
  const show = (title, text) => {
    box.innerHTML = `<div class="narrow-card share-empty"><h1>${esc(title)}</h1><p class="muted">${esc(text)}</p>
      <div class="result-actions"><a class="primary-btn" href="/dashboard.html" style="text-decoration:none">Email settings</a> <a class="secondary-btn" href="/" style="text-decoration:none">CapturaGo</a></div></div>`;
  };
  if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(token)) { show('This link is incomplete', 'Please open the whole link from the email, or switch emails off in your dashboard.'); return; }
  const { data, error } = await CG.emailPrefs.unsubscribe(token);
  if (error || data !== true) { show("We couldn't use this link", 'It may be old. You can switch tips & reminders off in your dashboard (Overview → Emails).'); return; }
  show("You're unsubscribed", "We won't send you tips & reminders any more. Emails about your bookings and messages still arrive. You can switch tips back on in your dashboard.");
});
</script>
</body>
</html>
