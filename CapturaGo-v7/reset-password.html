<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set a new password – CapturaGo</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="page-simple">
<nav class="simple-nav">
  <a href="/" class="logo"><svg class="logo-icon" viewBox="-110 -110 220 220" width="0.9em" height="0.9em" aria-hidden="true" style="display:inline;vertical-align:-0.08em"><path d="M 0.00 -100.00 Q 3.18 -25.68 14.14 -14.14 Q 25.68 -3.18 100.00 0.00 Q 25.68 3.18 14.14 14.14 Q 3.18 25.68 0.00 100.00 Q -3.18 25.68 -14.14 14.14 Q -25.68 3.18 -100.00 0.00 Q -25.68 -3.18 -14.14 -14.14 Q -3.18 -25.68 0.00 -100.00 Z" fill="currentColor"/></svg> CapturaGo</a>
  <a href="/" class="back">← Home</a>
</nav>
<main class="center-page">
  <div class="narrow-card">
    <h1>New password</h1>
    <p id="resetIntro" class="muted" style="margin-bottom:18px">Checking your reset link…</p>
    <form id="resetForm" hidden>
      <div class="form-row"><label for="newPw">New password</label><input id="newPw" type="password" autocomplete="new-password" minlength="8" required placeholder="min. 8 characters" /></div>
      <div class="form-row"><label for="newPw2">Repeat password</label><input id="newPw2" type="password" autocomplete="new-password" minlength="8" required /></div>
      <button type="submit" class="primary-btn" style="width:100%">Save new password</button>
      <p id="resetError" class="auth-error"></p>
    </form>
  </div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/vendor/supabase.umd.js"></script>
<script src="/supabase.js"></script>
<script src="/site.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const intro = document.getElementById('resetIntro');
  const form = document.getElementById('resetForm');
  let ready = false;
  const showForm = () => {
    if (ready) return; ready = true;
    intro.textContent = 'Choose a new password for your account.';
    form.hidden = false;
  };
  CG.auth.onChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' || (session && event === 'SIGNED_IN')) showForm();
  });
  setTimeout(async () => {
    if (ready) return;
    const user = await CG.auth.getUser();
    if (user) showForm();
    else intro.innerHTML = 'This reset link is invalid or has expired. <a href="/">Go back</a> and request a new one via "Forgot password?".';
  }, 2500);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const a = document.getElementById('newPw').value, b = document.getElementById('newPw2').value;
    const err = document.getElementById('resetError');
    if (a.length < 8) { err.textContent = 'Password must be at least 8 characters.'; return; }
    if (a !== b) { err.textContent = "Passwords don't match."; return; }
    const btn = form.querySelector('button');
    btn.disabled = true; btn.textContent = 'Saving…';
    const { error } = await CG.auth.updatePassword(a);
    btn.disabled = false; btn.textContent = 'Save new password';
    if (error) { err.textContent = error.message || 'Could not update password.'; return; }
    showToast('Password updated! Redirecting…', 'success');
    setTimeout(() => { window.location.href = '/'; }, 1500);
  });
});
</script>
</body>
</html>
